[defaults]
inventory              = /vagrant/ansible/inventories/hosts.yaml
roles_path             = /vagrant/ansible/roles
remote_user            = vagrant
private_key_file       = /home/vagrant/.ssh/id_ed25519
host_key_checking      = False        ; laboratoire uniquement (en production : known_hosts géré)
retry_files_enabled    = False
interpreter_python     = auto_silent
callback_result_format = yaml         ; sorties lisibles
nocows                 = True
; Une identité Ansible Vault par environnement (activée au TP4)
vault_identity_list    = preprod@/vagrant/ansible/.vault_pass_preprod, prod@/vagrant/ansible/.vault_pass_prod

[ssh_connection]
pipelining = True                     ; moins d'allers-retours SSH, exécution plus rapide
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
